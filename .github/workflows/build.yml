name: Build & push images

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend
    outputs:
      image_tag: ${{ steps.primary_tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}

      - name: Vite backend URL for image build
        id: vite_backend
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "url=http://my-fridge.multiplus.ovh:3001" >> $GITHUB_OUTPUT
          else
            echo "url=https://my-fridge.multiplus.ovh" >> $GITHUB_OUTPUT
          fi

      - name: Frontend staging banner metadata
        id: fe_banner
        run: |
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "show=true" >> $GITHUB_OUTPUT
            echo "branch=${{ github.head_ref }}" >> $GITHUB_OUTPUT
            echo "commit=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            echo "show=false" >> $GITHUB_OUTPUT
            echo "branch=" >> $GITHUB_OUTPUT
            echo "commit=" >> $GITHUB_OUTPUT
          fi

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_BACKEND_URL=${{ steps.vite_backend.outputs.url }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_SHOW_ENV_BANNER=${{ steps.fe_banner.outputs.show }}
            VITE_DEPLOY_BRANCH=${{ steps.fe_banner.outputs.branch }}
            VITE_DEPLOY_COMMIT=${{ steps.fe_banner.outputs.commit }}
            VITE_BUILD_DATE=${{ steps.fe_banner.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Compute primary tag
        id: primary_tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Summary
        run: |
          echo "### ${{ matrix.service }} – image publiée" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag pour deploy :** \`${{ steps.primary_tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY

  notify-pr:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ needs.build.outputs.image_tag }}';
            const repo = `ghcr.io/${{ github.repository }}`;
            const body = [
              `🐳 **Images disponibles**`,
              ``,
              `\`\`\``,
              `${repo}/backend:${tag}`,
              `${repo}/frontend:${tag}`,
              `\`\`\``,
              ``,
              `➡️ [Déployer sur le Pi](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/deploy.yml) en saisissant la version \`${tag}\``
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
