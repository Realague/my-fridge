name: Deploy to Raspberry Pi

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à déployer (ex: 1.2.3, pr-42)'
        required: true
        default: 'latest'
  push:
    tags: ['v*']

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Resolve version
        id: resolve
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            # Tag push: strip leading 'v' to match build.yml's type=semver,pattern={{version}}
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

      - name: Detect deploy type
        id: type
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          if [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}(-.+)?$ ]]; then
            KIND="release"
          else
            KIND="pr"
          fi
          echo "kind=$KIND" >> $GITHUB_OUTPUT
          echo "Detected kind: $KIND (version: $VERSION)"

      - name: Verify required secrets are present
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          missing=()
          for v in VITE_GOOGLE_CLIENT_ID CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY CLOUDINARY_API_SECRET VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT; do
            if [ -z "${!v}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Repository secret(s) missing or empty: ${missing[*]}"
            exit 1
          fi
          echo "All required repository secrets are present."

      - name: Fix repo ownership (self-hosted)
        working-directory: /home/realague/my-fridge
        run: |
          # Docker mounts can leave files owned by root; restore ownership to the runner user
          # via an ephemeral alpine container (avoids needing passwordless sudo on the Pi).
          docker run --rm -v "$(pwd):/work" alpine \
            chown -R "$(id -u):$(id -g)" /work

      - name: Git pull & checkout
        working-directory: /home/realague/my-fridge
        run: |
          git fetch --all --prune
          git checkout "${{ github.ref_name }}"
          git pull --ff-only origin "${{ github.ref_name }}"

      - name: Wait for images & pull
        working-directory: /home/realague/my-fridge
        env:
          APP_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          # On tag push, build.yml runs in parallel — poll until both images exist, then pull.
          for i in $(seq 1 60); do
            if docker compose pull backend frontend; then
              echo "Images pulled on attempt $i."
              exit 0
            fi
            echo "Images not ready (attempt $i/60), retrying in 15s..."
            sleep 15
          done
          echo "::error::Timed out waiting for images ${APP_VERSION} on GHCR (15 min)."
          exit 1

      # ---- RELEASE (tag SemVer) ----
      - name: Deploy (release)
        if: steps.type.outputs.kind == 'release'
        working-directory: /home/realague/my-fridge
        env:
          APP_VERSION: ${{ steps.resolve.outputs.version }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          echo "🚀 Déploiement RELEASE ${APP_VERSION}"
          docker compose -f docker-compose.yml --profile prod \
            -p my-fridge_prod up -d --remove-orphans
          docker compose -f docker-compose.yml --profile prod \
            -p my-fridge_prod up -d --force-recreate --no-deps backend frontend
          docker tag ghcr.io/${{ github.repository }}/backend:${APP_VERSION} \
                     ghcr.io/${{ github.repository }}/backend:last-stable-local
          docker tag ghcr.io/${{ github.repository }}/frontend:${APP_VERSION} \
                     ghcr.io/${{ github.repository }}/frontend:last-stable-local
          echo "Verifying backend received required env vars..."
          for v in VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY CLOUDINARY_API_SECRET; do
            val=$(docker compose -f docker-compose.yml -p my-fridge_prod exec -T backend printenv "$v" 2>/dev/null | tr -d '\r\n' || true)
            if [ -n "$val" ]; then
              echo "  $v: SET (len=${#val})"
            else
              echo "::error::  $v: MISSING or empty in backend container"
              exit 1
            fi
          done

      # ---- PR (preview) ----
      - name: Deploy (PR preview)
        if: steps.type.outputs.kind == 'pr'
        working-directory: /home/realague/my-fridge
        env:
          APP_VERSION: ${{ steps.resolve.outputs.version }}
          DB_NAME: my_fridge_db_staging
          DB_PORT: "5433"
          BACKEND_PORT: "3001"
          FRONTEND_PORT: "8081"
          FRONTEND_URL: http://my-fridge.multiplus.ovh:8081
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          echo "🧪 Déploiement STAGING ${APP_VERSION}"
          docker compose -f docker-compose.yml -p my-fridge_staging \
            up -d --remove-orphans
          docker compose -f docker-compose.yml -p my-fridge_staging \
            up -d --force-recreate --no-deps backend frontend
          echo "Verifying backend received required env vars..."
          for v in VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY CLOUDINARY_API_SECRET; do
            val=$(docker compose -f docker-compose.yml -p my-fridge_staging exec -T backend printenv "$v" 2>/dev/null | tr -d '\r\n' || true)
            if [ -n "$val" ]; then
              echo "  $v: SET (len=${#val})"
            else
              echo "::error::  $v: MISSING or empty in backend container"
              exit 1
            fi
          done

      - name: Cleanup old images
        run: docker image prune -f

      - name: Status
        working-directory: /home/realague/my-fridge
        env:
          APP_VERSION: ${{ steps.resolve.outputs.version }}
        run: docker compose ps

      - name: Summary
        run: |
          echo "### Déploiement terminé" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Type :** \`${{ steps.type.outputs.kind }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version :** \`${{ steps.resolve.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger :** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref :** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
