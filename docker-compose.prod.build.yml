# Production: images construites sur la machine (pas de pull GHCR, pas de tag d’image).
# Exemple : docker compose -f docker-compose.prod.build.yml --profile prod up --build -d
#
# Variables utiles (fichier .env à la racine du repo) :
#   VITE_API_URL            — origine publique du site (ex. https://my-fridge.multiplus.ovh), sans /api
#   VITE_GOOGLE_CLIENT_ID   — optionnel, auth Google côté client
# Les autres variables restent les mêmes que docker-compose.yml (DB_*, CLOUDINARY_*, FRONTEND_URL, etc.)

services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    profiles:
      - prod
    ports:
      - "80:80"
      - "443:443"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-my_fridge_db}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ${DB_NAME:-my_fridge_db}
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-https://my-fridge.multiplus.ovh}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://my-fridge.multiplus.ovh}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
