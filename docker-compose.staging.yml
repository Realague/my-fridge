# Explicit network so backend always shares DNS with db (avoids ENOTFOUND db on some hosts).
networks:
  staging:
    driver: bridge

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    restart: always
    networks:
      - staging
    environment:
      POSTGRES_DB: my_fridge_db_staging
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # host:container — Postgres listens on 5432 inside container
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.staging
    restart: always
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: my_fridge_db_staging
      PORT: 3001
      FRONTEND_URL: http://my-fridge.multiplus.ovh:8081
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_GOOGLE_CLIENT_SECRET: ${VITE_GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-${VITE_GOOGLE_CLIENT_ID:-}}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-${VITE_GOOGLE_CLIENT_SECRET:-}}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - staging
    volumes:
      - ./backend:/app
      # Named volume so a bad node_modules tree can be dropped without touching pgdata:
      #   docker compose -f docker-compose.staging.yml stop backend && docker compose -f docker-compose.staging.yml rm -f backend
      #   docker volume ls   # find *backend_node_modules*, then docker volume rm <that name>
      - backend_node_modules:/app/node_modules
    command: npm run dev

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.staging
    restart: always
    environment:
      VITE_BACKEND_URL: http://my-fridge.multiplus.ovh:3001
      VITE_PORT: 8081
      VITE_SHOW_ENV_BANNER: ${VITE_SHOW_ENV_BANNER:-}
      VITE_DEPLOY_BRANCH: ${VITE_DEPLOY_BRANCH:-}
      VITE_DEPLOY_COMMIT: ${VITE_DEPLOY_COMMIT:-}
      VITE_BUILD_DATE: ${VITE_BUILD_DATE:-}
    ports:
      - "8081:8081"
    networks:
      - staging
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  pgdata:
  backend_node_modules: 