<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fresh — Import de recette (desktop)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf8ed; --card: #ffffff; --sub: #f6efde; --page-bg: #ece2cc;
    --ink: #1a1d1a; --ink-2: #5e6760; --ink-3: #9ba59f; --rule: #ece4d2;
    --green: #2bb673; --green-soft: #d6f3e3; --green-deep: #1f9c5e;
    --orange: #ff7a3a; --orange-soft: #ffe0cc; --orange-deep: #a4451a;
    --red: #ef4a5a; --red-soft: #ffd9de; --red-deep: #b22233;
    --yellow: #ffc839; --yellow-soft: #fff1c4; --amber: #8a6a06;
    --blue: #4f8ef5; --blue-soft: #dae9ff; --blue-deep: #2b5db8;
    --purple: #8c6df0; --purple-soft: #e4dafa; --purple-deep: #5536c7;
    --pink-soft: #ffd9e6;
    --font-display: "DM Sans", system-ui, sans-serif;
    --font-body: "Inter", ui-sans-serif, system-ui, sans-serif;
    --sh-sm: 0 1px 2px rgba(0,0,0,.04); --sh-md: 0 6px 18px rgba(0,0,0,.06); --sh-lg: 0 24px 60px rgba(0,0,0,.10);
  }
  [data-theme="dark"] {
    --bg: #15181b; --card: #1f2326; --sub: #272c30; --page-bg: #0a0c0d;
    --ink: #f4ede0; --ink-2: #a8b0a8; --ink-3: #6a7370; --rule: #2e3439;
    --green: #34c97f; --green-soft: #1d3a2c; --green-deep: #5ee4a0;
    --orange: #ff8a4f; --orange-soft: #4a2a1a; --orange-deep: #ffb98a;
    --red: #ff6071; --red-soft: #4a1d24; --red-deep: #ff9aa6;
    --yellow: #ffd158; --yellow-soft: #423318; --amber: #ffd158;
    --blue: #6aa3ff; --blue-soft: #1c2e4d; --blue-deep: #a9c8ff;
    --purple: #a48cff; --purple-soft: #2e2350; --purple-deep: #c9b8ff;
    --pink-soft: #4a1f30;
    --sh-sm: 0 1px 2px rgba(0,0,0,.4); --sh-md: 0 6px 16px rgba(0,0,0,.45); --sh-lg: 0 14px 32px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-body); color: var(--ink); background: var(--page-bg);
    -webkit-font-smoothing: antialiased; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 32px 24px;
    transition: background-color .25s;
  }
  .lic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; stroke-width: 2; }

  /* ── App window ─────────────────────────── */
  .app {
    width: 1280px; height: 840px; flex-shrink: 0; background: var(--bg); border-radius: 20px; overflow: hidden;
    box-shadow: 0 40px 80px -24px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.25);
    display: grid; grid-template-columns: 244px 1fr; position: relative;
  }
  .sidebar { background: var(--card); border-right: 1px solid var(--rule); padding: 20px 14px 16px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 22px; }
  .brand-logo { width: 36px; height: 36px; border-radius: 12px; background: var(--green-soft); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
  .brand-name { font-family: var(--font-display); font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
  .brand-name em { color: var(--green); font-style: normal; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 12px; font-family: var(--font-display); font-size: 14px; font-weight: 600; color: var(--ink-2); text-decoration: none; cursor: pointer; }
  .nav a .lic { width: 18px; height: 18px; }
  .nav a.active { background: var(--green-soft); color: var(--green-deep); }
  .nav a:hover:not(.active) { background: var(--sub); color: var(--ink); }
  .sidebar-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--rule); }
  .collapse { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; color: var(--ink-3); font-family: var(--font-display); font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .collapse:hover { background: var(--sub); color: var(--ink-2); }
  .collapse .lic { width: 15px; height: 15px; }

  .main { display: flex; flex-direction: column; height: 100%; overflow: hidden; min-width: 0; }
  .topbar { height: 62px; border-bottom: 1px solid var(--rule); background: var(--bg); display: flex; align-items: center; justify-content: space-between; padding: 0 26px; flex-shrink: 0; }
  .crumb { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }
  .crumb b { color: var(--ink); font-weight: 700; }
  .crumb .lic { width: 15px; height: 15px; color: var(--ink-3); }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .tt { background: var(--card); color: var(--ink); border: 1px solid var(--rule); border-radius: 999px; padding: 8px 13px 8px 11px; display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 12.5px; cursor: pointer; }
  .tt .lic { width: 15px; height: 15px; }
  .tt .swm { width: 28px; height: 16px; border-radius: 999px; background: var(--rule); position: relative; }
  .tt .swm::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: left .2s; }
  [data-theme="dark"] .tt .swm { background: var(--green); } [data-theme="dark"] .tt .swm::after { left: 14px; }
  .user-chip { display: flex; align-items: center; gap: 9px; background: var(--card); padding: 5px 13px 5px 5px; border-radius: 999px; box-shadow: var(--sh-sm); }
  .user-chip .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--green); color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .user-chip .nm { font-family: var(--font-display); font-weight: 700; font-size: 13px; }

  .content { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; position: relative; }
  .content::-webkit-scrollbar { width: 10px; } .content::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 10px; border: 3px solid var(--bg); }
  .center-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px; }

  .card { background: var(--card); border-radius: 20px; padding: 22px 24px; box-shadow: var(--sh-sm); }
  .label { font-family: var(--font-display); font-weight: 700; font-size: 12px; color: var(--ink-2); margin: 0 2px 8px; }
  .field { background: var(--sub); border: 1.5px solid transparent; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 10px; transition: border-color .12s, background .12s; }
  .field:focus-within { border-color: var(--green); background: var(--card); }
  .field.err { border-color: var(--red); background: var(--red-soft); }
  .field .lic { color: var(--ink-3); width: 18px; height: 18px; flex-shrink: 0; }
  .field input { border: 0; background: transparent; outline: 0; flex: 1; min-width: 0; font-family: var(--font-body); font-size: 15px; color: var(--ink); }
  .field input::placeholder { color: var(--ink-3); }
  .field .paste { border: 0; background: var(--card); color: var(--ink-2); cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 12.5px; border-radius: 999px; padding: 7px 12px; display: inline-flex; align-items: center; gap: 5px; }
  .field .paste .lic { width: 13px; height: 13px; color: var(--ink-2); }

  .btn { appearance: none; border: 0; cursor: pointer; font-family: var(--font-display); font-weight: 700; border-radius: 999px; padding: 13px 22px; font-size: 14.5px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .08s, box-shadow .2s, opacity .2s; }
  .btn:active { transform: translateY(1px); }
  .btn .lic { width: 17px; height: 17px; }
  .btn.green { background: var(--green); color: #fff; box-shadow: 0 6px 16px rgba(43,182,115,.28); }
  .btn.ghost { background: var(--sub); color: var(--ink); }
  .btn.block { width: 100%; }
  [data-theme="dark"] .btn.green { box-shadow: 0 6px 16px rgba(52,201,127,.35); }

  .intro-head { display: flex; align-items: flex-start; gap: 14px; }
  .tile { width: 46px; height: 46px; border-radius: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .tile .lic { width: 22px; height: 22px; }
  .intro-head .t { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; }
  .intro-head .d { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; line-height: 1.5; }
  .helper { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; color: var(--ink-2); line-height: 1.5; margin-top: 18px; }
  .helper .lic { width: 16px; height: 16px; color: var(--ink-3); flex-shrink: 0; margin-top: 1px; }
  .inline-err { display: none; align-items: center; gap: 7px; color: var(--red-deep); font-size: 12.5px; font-weight: 600; margin-top: 11px; }
  .inline-err.show { display: flex; } .inline-err .lic { width: 14px; height: 14px; }
  .try-note { font-size: 12px; color: var(--ink-3); text-align: center; margin-top: 20px; line-height: 1.6; }
  .try-note b { color: var(--ink-2); }

  .mascot-holder { width: 168px; height: 168px; border-radius: 50%; background: var(--sub); display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
  .mascot-holder img { width: 148px; object-fit: contain; margin-bottom: -6px; }
  .center-wrap h2 { font-family: var(--font-display); font-weight: 800; font-size: 27px; letter-spacing: -0.02em; margin: 24px 0 0; }
  .center-wrap .p { font-size: 15px; color: var(--ink-2); margin-top: 10px; line-height: 1.5; max-width: 380px; }
  .src-chip { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; background: var(--sub); color: var(--ink-2); border-radius: 999px; padding: 7px 15px; font-family: var(--font-display); font-weight: 700; font-size: 12.5px; max-width: 460px; }
  .src-chip .lic { width: 14px; height: 14px; flex-shrink: 0; } .src-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .progress { width: 100%; max-width: 380px; height: 8px; border-radius: 999px; background: var(--sub); overflow: hidden; margin-top: 28px; }
  .progress > i { display: block; height: 100%; width: 8%; border-radius: 999px; background: var(--green); transition: width .5s ease; }
  .steps-list { width: 100%; max-width: 380px; margin-top: 24px; display: flex; flex-direction: column; gap: 13px; }
  .sl-row { display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 600; font-size: 14px; text-align: left; transition: color .3s; }
  .sl-row .dot { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .3s; }
  .sl-row .dot .lic { width: 14px; height: 14px; }
  .sl-row.done { color: var(--ink); } .sl-row.done .dot { background: var(--green); color: #fff; }
  .sl-row.active { color: var(--ink); } .sl-row.active .dot { background: var(--green-soft); color: var(--green-deep); }
  .sl-row.wait { color: var(--ink-3); } .sl-row.wait .dot { background: var(--sub); color: var(--ink-3); }
  .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  .err-url { display: inline-flex; align-items: center; gap: 7px; max-width: 460px; background: var(--red-soft); color: var(--red-deep); border-radius: 12px; padding: 10px 15px; font-size: 13px; margin-top: 18px; overflow: hidden; }
  .err-url span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .err-url .lic { width: 15px; height: 15px; flex-shrink: 0; }

  /* ── Review (desktop) ───────────────────── */
  .rev { padding: 24px 32px 0; max-width: 1180px; width: 100%; margin: 0 auto; }
  .rev-source { display: inline-flex; align-items: center; gap: 7px; margin: 0 2px 16px; color: var(--ink-2); font-family: var(--font-display); font-weight: 600; font-size: 13px; }
  .rev-source a { color: var(--green-deep); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
  .rev-source .lic { width: 14px; height: 14px; }
  .rev-header { display: grid; grid-template-columns: 320px 1fr; gap: 26px; align-items: stretch; }
  .rev-photo { position: relative; border-radius: 18px; overflow: hidden; min-height: 240px; background: radial-gradient(120% 120% at 20% 10%, rgba(255,180,90,.30), transparent 55%), radial-gradient(120% 120% at 90% 90%, rgba(230,90,30,.22), transparent 50%), var(--sub); display: flex; align-items: center; justify-content: center; }
  .rev-photo .cook .lic { width: 76px; height: 76px; stroke-width: 1.3; color: var(--orange-deep); opacity: .5; }
  .rev-photo .change { position: absolute; bottom: 13px; right: 13px; display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.94); color: #1a1d1a; border: 0; cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 12.5px; border-radius: 999px; padding: 8px 13px; box-shadow: var(--sh-sm); }
  .rev-photo .change .lic { width: 14px; height: 14px; }
  .rev-htext { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .editable { outline: 0; border-radius: 8px; transition: box-shadow .12s, background .12s; }
  .editable:focus { box-shadow: 0 0 0 2px var(--green); background: var(--card); }
  .rev-title { font-family: var(--font-display); font-weight: 800; font-size: 36px; line-height: 1.08; letter-spacing: -0.03em; color: var(--ink); }
  .rev-desc { font-family: var(--font-body); font-size: 15px; line-height: 1.55; color: var(--ink-2); margin-top: 12px; max-width: 620px; }
  .meta-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 13px; margin-top: 18px; }
  .bubble { border-radius: 18px; padding: 15px 17px; }
  .bubble .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--card); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
  .bubble .ic .lic { width: 18px; height: 18px; }
  .bubble .v { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; line-height: 1; display: flex; align-items: baseline; gap: 4px; }
  .bubble .v .u { font-size: 14px; font-weight: 700; opacity: .6; }
  .bubble .v .editable { min-width: 22px; display: inline-block; }
  .bubble .l { font-family: var(--font-display); font-weight: 600; font-size: 12.5px; color: var(--ink-2); margin-top: 7px; }
  .bubble.blue { background: var(--blue-soft); } .bubble.blue .ic { color: var(--blue); } .bubble.blue .v { color: var(--blue-deep); }
  .bubble.orange { background: var(--orange-soft); } .bubble.orange .ic { color: var(--orange); } .bubble.orange .v { color: var(--orange-deep); }
  .bubble.green { background: var(--green-soft); } .bubble.green .ic { color: var(--green); } .bubble.green .v { color: var(--green-deep); }
  .bubble.yellow { background: var(--yellow-soft); } .bubble.yellow .ic { color: #d9a300; } .bubble.yellow .v { color: var(--amber); }
  [data-theme="dark"] .bubble.yellow .ic { color: var(--yellow); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; font-family: var(--font-display); font-weight: 700; font-size: 13px; }
  .tag .lic { width: 14px; height: 14px; }
  .tag .rm { cursor: pointer; opacity: .55; display: inline-flex; } .tag .rm:hover { opacity: 1; } .tag .rm .lic { width: 12px; height: 12px; }
  .tag.green { background: var(--green-soft); color: var(--green-deep); }
  .tag.blue { background: var(--blue-soft); color: var(--blue-deep); }
  .tag.purple { background: var(--purple-soft); color: var(--purple-deep); }
  .tag.add { background: transparent; border: 1.5px dashed #d6cdb3; color: var(--ink-2); cursor: pointer; }
  [data-theme="dark"] .tag.add { border-color: #3a4148; }

  .rev-body { display: grid; grid-template-columns: 1.12fr 1fr; gap: 22px; align-items: start; margin-top: 26px; }
  .panel { background: var(--card); border-radius: 20px; padding: 22px 24px; box-shadow: var(--sh-sm); }
  .panel-h { display: flex; align-items: center; gap: 11px; margin-bottom: 4px; }
  .panel-h .pic { width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; }
  .panel-h .pic .lic { width: 18px; height: 18px; }
  .panel-h h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }
  .panel-h .count { margin-left: auto; font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--ink-3); }
  .panel-sub { font-size: 13px; color: var(--ink-2); margin: 0 0 14px 45px; line-height: 1.4; }

  .recap { background: var(--bg); border: 1px solid var(--rule); border-radius: 14px; padding: 13px 15px; margin: 0 0 14px; }
  .recap .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .recap .item { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-display); font-weight: 700; font-size: 13px; }
  .recap .item .lic { width: 15px; height: 15px; }
  .recap .item.danger { color: var(--red-deep); } .recap .item.warn { color: var(--amber); } .recap .item.ok { color: var(--green-deep); } .recap .item.zero { color: var(--ink-3); }
  .recap .note { font-size: 12px; color: var(--ink-2); margin-top: 9px; display: flex; align-items: center; gap: 7px; line-height: 1.4; }
  .recap .note.allgood { color: var(--green-deep); font-weight: 600; }
  .recap .note .lic { width: 14px; height: 14px; color: var(--ink-3); flex-shrink: 0; } .recap .note.allgood .lic { color: var(--green); }

  .ings { display: flex; flex-direction: column; gap: 9px; }
  .ing { display: grid; grid-template-columns: 42px 1fr auto; gap: 13px; align-items: center; background: var(--bg); border: 1px solid var(--rule); border-left: 3px solid var(--rule); border-radius: 14px; padding: 12px 14px; min-height: 64px; cursor: pointer; transition: border-color .12s, background .12s; }
  .ing:hover { border-color: #d9cfb6; } [data-theme="dark"] .ing:hover { border-color: #3a4148; }
  .ing .cat { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ing .cat .lic { width: 21px; height: 21px; }
  .ing .cat.missing { border: 1.5px dashed currentColor; background: transparent; }
  .ing .main { min-width: 0; }
  .ing .art { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--ink); line-height: 1.15; }
  .ing .art .none { color: var(--red-deep); font-style: italic; font-weight: 600; }
  .ing .brut { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .ing .stat { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; font-family: var(--font-display); font-weight: 700; font-size: 11.5px; padding: 3px 10px 3px 8px; border-radius: 999px; }
  .ing .stat .lic { width: 13px; height: 13px; }
  .ing .right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .qty { font-family: var(--font-display); font-weight: 800; font-size: 15px; color: var(--ink); white-space: nowrap; }
  .qty .u { font-weight: 700; font-size: 12.5px; color: var(--ink-2); margin-left: 2px; }
  .qty.eye { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 12.5px; color: var(--ink-2); background: var(--sub); border-radius: 999px; padding: 5px 11px; }
  .qty.eye .lic { width: 13px; height: 13px; color: var(--ink-3); }
  .ing .chev { color: var(--ink-3); display: flex; } .ing .chev .lic { width: 17px; height: 17px; }
  .fix-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 12.5px; border-radius: 999px; padding: 9px 14px; white-space: nowrap; }
  .fix-btn .lic { width: 14px; height: 14px; }
  .ing.ok .stat { background: var(--green-soft); color: var(--green-deep); } .ing.ok .cat { background: var(--sub); color: var(--ink-2); }
  .ing.warn { border-left-color: var(--orange); background: color-mix(in srgb, var(--orange-soft) 40%, var(--card)); }
  .ing.warn .stat { background: var(--orange-soft); color: var(--orange-deep); } .ing.warn .cat { color: var(--orange-deep); background: var(--orange-soft); }
  .ing.warn .fix-btn { background: transparent; color: var(--orange-deep); border: 1.5px solid color-mix(in srgb, var(--orange) 55%, transparent); }
  .ing.danger { border-left-color: var(--red); background: color-mix(in srgb, var(--red-soft) 40%, var(--card)); grid-template-columns: 42px 1fr auto; grid-auto-rows: min-content; }
  .ing.danger .stat { background: var(--red-soft); color: var(--red-deep); } .ing.danger .cat { color: var(--red-deep); }
  .ing.danger .full { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 2px; }
  .ing.danger .fix-btn { background: var(--red); color: #fff; }
