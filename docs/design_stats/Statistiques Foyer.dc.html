<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script>try{localStorage.setItem('i18nextLng','fr')}catch(e){}document.documentElement.lang='fr';</script>
<script src="./ds-base.js"></script>
<script src="./image-slot.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0}body{background:#efe4c4}a{color:var(--mf-green-deep);text-decoration:none}a:hover{color:var(--mf-green)}@keyframes mfRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.mfscroll::-webkit-scrollbar{width:6px}.mfscroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,.14);border-radius:99px}</style>
</helmet>
<div class="{{ themeClass }}" style="min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--mf-text);background:radial-gradient(1200px 620px at 50% -12%, var(--mf-night-surface), transparent 62%), var(--mf-night);padding:56px 44px 80px">
  <header style="max-width:1420px;margin:0 auto 30px">
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:16px">
      <span style="width:22px;height:22px;border-radius:7px;background:var(--mf-green);display:inline-flex;align-items:center;justify-content:center">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
      </span>
      <span class="mf-eyebrow" style="color:var(--mf-green-deep)">MyFridge · Statistiques de foyer — phase 1</span>
    </div>
    <h1 class="font-display" style="margin:0;font-size:41px;font-weight:700;letter-spacing:-.025em;line-height:1.04;color:var(--mf-text)">Ce que fait ton foyer, en chiffres</h1>
    <p style="margin:14px 0 0;max-width:680px;font-size:17px;line-height:1.55;color:var(--mf-text-soft);text-wrap:pretty">Deux cartes résumé sur le tableau de bord, une page détail en trois blocs. Observation factuelle : pas de classement entre membres, pas d'estimation € ni CO₂.</p>
  </header>
  <div style="max-width:1420px;margin:0 auto 34px;display:flex;flex-wrap:wrap;gap:26px;align-items:flex-end;padding:18px 20px;background:var(--mf-night-surface);border:1px solid var(--mf-night-line);border-radius:var(--mf-radius-lg)">
    <div style="display:flex;flex-direction:column;gap:8px">
      <span class="mf-eyebrow" style="color:var(--mf-text-mute)">Écran</span>
      <div class="mf-toggle-group">
        <sc-for list="{{ screenOpts }}" as="o" hint-placeholder-count="2">
          <button class="{{ o.cls }}" onClick="{{ o.on }}">{{ o.label }}</button>
        </sc-for>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span class="mf-eyebrow" style="color:var(--mf-text-mute)">Variante des cartes</span>
      <div class="mf-toggle-group">
        <sc-for list="{{ variantOpts }}" as="o" hint-placeholder-count="2">
          <button class="{{ o.cls }}" onClick="{{ o.on }}">{{ o.label }}</button>
        </sc-for>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span class="mf-eyebrow" style="color:var(--mf-text-mute)">État du foyer</span>
      <div class="mf-toggle-group">
        <sc-for list="{{ householdOpts }}" as="o" hint-placeholder-count="4">
          <button class="{{ o.cls }}" onClick="{{ o.on }}">{{ o.label }}</button>
        </sc-for>
      </div>
    </div>
  </div>
  <div style="max-width:1420px;margin:0 auto;display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start;justify-content:center">
    <sc-if value="{{ showMobile }}" hint-placeholder-val="{{ true }}">
    <figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:18px">
      <div style="width:392px;background:#0e1014;border-radius:52px;padding:13px;box-shadow:0 50px 90px -34px rgba(45,33,10,.55),0 0 0 1px rgba(0,0,0,.05)">
        <div style="position:relative;background:var(--mf-night);border-radius:40px;overflow:hidden;height:762px;display:flex;flex-direction:column">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:15px 28px 4px;font-family:'DM Sans';font-weight:600;font-size:14.5px;color:var(--mf-text);flex-shrink:0">
            <span>9:41</span>
            <span style="display:flex;align-items:center;gap:7px;color:var(--mf-text)">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
              <span style="font-size:11.5px;font-weight:700;letter-spacing:.02em">5G</span>
              <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x=".5" y=".5" width="21" height="12" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2.4" y="2.4" width="15.5" height="8.2" rx="2" fill="currentColor"/><rect x="23" y="4" width="2.2" height="5" rx="1.1" fill="currentColor" opacity=".4"/></svg>
            </span>
          </div>
          <sc-if value="{{ isDashboard }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 20px 12px;flex-shrink:0">
            <div>
              <div style="font-size:13px;font-weight:500;color:var(--mf-text-soft)">Bonjour, Camille</div>
              <div class="font-display" style="font-size:21px;font-weight:700;letter-spacing:-.01em;color:var(--mf-text)">{{ householdName }}</div>
            </div>
            <div style="width:42px;height:42px;border-radius:999px;background:var(--mf-green-soft);color:var(--mf-green-deep);display:flex;align-items:center;justify-content:center;font-family:'DM Sans';font-weight:700;font-size:14.5px">CD</div>
          </div>
          <div class="mfscroll" style="flex:1;overflow-y:auto;padding:2px 16px 16px;display:flex;flex-direction:column;gap:12px">
            <div style="display:flex;align-items:baseline;justify-content:space-between;padding:0 2px">
              <span class="mf-eyebrow" style="color:var(--mf-text-mute)">Tes statistiques</span>
              <button onClick="{{ goStats }}" style="border:0;background:transparent;color:var(--mf-green-deep);font-family:'DM Sans';font-weight:600;font-size:13px;cursor:pointer;padding:0">Tout voir</button>
            </div>

            <sc-if value="{{ isVariantA }}" hint-placeholder-val="{{ true }}">
            <button onClick="{{ goGaspi }}" style="width:100%;text-align:left;border:1px solid var(--mf-night-line);background:var(--mf-night-surface);border-radius:var(--mf-radius-xl);padding:16px 16px 14px;cursor:pointer;box-shadow:0 1px 2px rgba(20,15,5,.05);display:flex;flex-direction:column;gap:8px;animation:mfRise .45s ease both;font-family:inherit">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
                <span class="mf-eyebrow" style="color:var(--mf-text-mute)">Anti-gaspi — {{ dashMonth }}</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--mf-text-mute)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
              </div>
              <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
                <div style="display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 9px;min-width:0">
                  <span class="font-display" style="font-size:46px;line-height:.9;font-weight:700;letter-spacing:-.03em;color:var(--mf-green-deep)">{{ dashTaux }}<span style="font-size:22px">%</span></span>
                  <sc-if value="{{ dashShowTrends }}" hint-placeholder-val="{{ true }}">
                    <span class="mf-badge {{ dashTauxTrendClass }}" style="white-space:nowrap">{{ dashTauxTrendLabel }}</span>
                  </sc-if>
                </div>
                <svg width="104" height="40" viewBox="0 0 120 40" fill="none" style="flex-shrink:1;min-width:64px;opacity:.9">
                  <path d="{{ sparkTaux.area }}" fill="var(--mf-green-soft)"></path>
                  <polyline points="{{ sparkTaux.points }}" fill="none" stroke="var(--mf-green)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></polyline>
                  <circle cx="{{ sparkTaux.lx }}" cy="{{ sparkTaux.ly }}" r="3.4" fill="var(--mf-green)" stroke="var(--mf-night-surface)" stroke-width="2"></circle>
                </svg>
              </div>
              <div style="font-size:13px;color:var(--mf-text-soft);font-weight:500">Taux d'utilisation · {{ dashConsommes }} articles consommés, {{ dashJetes }} jetés</div>
            </button>
            <button onClick="{{ goCuisine }}" style="width:100%;text-align:left;border:1px solid var(--mf-night-line);background:var(--mf-night-surface);border-radius:var(--mf-radius-xl);padding:16px 16px 14px;cursor:pointer;box-shadow:0 1px 2px rgba(20,15,5,.05);display:flex;flex-direction:column;gap:8px;animation:mfRise .55s ease both;font-family:inherit">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
                <span class="mf-eyebrow" style="color:var(--mf-text-mute)">En cuisine — {{ dashMonth }}</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--mf-text-mute)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
              </div>
              <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
                <div style="display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 9px;min-width:0">
                  <span class="font-display" style="font-size:46px;line-height:.9;font-weight:700;letter-spacing:-.03em;color:var(--mf-pink-deep)">{{ dashCuisinees }}</span>
                  <sc-if value="{{ dashShowTrends }}" hint-placeholder-val="{{ true }}">
                    <span class="mf-badge {{ dashCuisineTrendClass }}" style="white-space:nowrap">{{ dashCuisineTrendLabel }}</span>
                  </sc-if>
                </div>
                <svg width="104" height="40" viewBox="0 0 120 40" fill="none" style="flex-shrink:1;min-width:64px;opacity:.9">
                  <path d="{{ sparkCuisine.area }}" fill="var(--mf-pink-soft)"></path>
                  <polyline points="{{ sparkCuisine.points }}" fill="none" stroke="var(--mf-pink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></polyline>
                  <circle cx="{{ sparkCuisine.lx }}" cy="{{ sparkCuisine.ly }}" r="3.4" fill="var(--mf-pink)" stroke="var(--mf-night-surface)" stroke-width="2"></circle>
                </svg>
              </div>
              <div style="font-size:13px;color:var(--mf-text-soft);font-weight:500">Recettes cuisinées · {{ dashDifferentes }} recettes différentes essayées</div>
            </button>
            </sc-if>

            <sc-if value="{{ isVariantB }}" hint-placeholder-val="{{ true }}">
            <button onClick="{{ goGaspi }}" style="width:100%;text-align:left;border:1px solid var(--mf-night-line);background:var(--mf-night-surface);border-radius:var(--mf-radius-xl);padding:15px;cursor:pointer;box-shadow:0 1px 2px rgba(20,15,5,.05);display:flex;align-items:center;gap:15px;animation:mfRise .45s ease both;font-family:inherit">
              <div style="position:relative;flex-shrink:0;width:84px;height:84px">
                <svg width="84" height="84" viewBox="0 0 84 84">
                  <circle cx="42" cy="42" r="34" fill="none" stroke="var(--mf-night-elevated)" stroke-width="9"></circle>
                  <circle cx="42" cy="42" r="34" fill="none" stroke="var(--mf-green)" stroke-width="9" stroke-linecap="round" stroke-dasharray="{{ dashRingTaux }}" transform="rotate(-90 42 42)"></circle>
                </svg>
                <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column">
                  <span class="font-display" style="font-size:23px;font-weight:700;letter-spacing:-.02em;color:var(--mf-green-deep);line-height:1">{{ dashTaux }}%</span>
                </div>
              </div>
              <div style="min-width:0;flex:1;display:flex;flex-direction:column;gap:5px">
                <span class="mf-eyebrow" style="color:var(--mf-text-mute)">Anti-gaspi — {{ dashMonth }}</span>
                <div class="font-display" style="font-size:16px;font-weight:700;color:var(--mf-text)">Taux d'utilisation</div>
                <div style="font-size:12.5px;color:var(--mf-text-soft);font-weight:500">{{ dashConsommes }} consommés · {{ dashJetes }} jetés</div>
                <sc-if value="{{ dashShowTrends }}" hint-placeholder-val="{{ true }}">
                  <span class="mf-badge {{ dashTauxTrendClass }}" style="align-self:flex-start;white-space:normal">{{ dashTauxTrendLabel }}</span>
                </sc-if>
              </div>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--mf-text-mute)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="m9 18 6-6-6-6"/></svg>
            </button>
            <button onClick="{{ goCuisine }}" style="width:100%;text-align:left;border:1px solid var(--mf-night-line);background:var(--mf-night-surface);border-radius:var(--mf-radius-xl);padding:15px;cursor:pointer;box-shadow:0 1px 2px rgba(20,15,5,.05);display:flex;align-items:center;gap:15px;animation:mfRise .55s ease both;font-family:inherit">
              <div style="position:relative;flex-shrink:0;width:84px;height:84px">
                <svg width="84" height="84" viewBox="0 0 84 84">
                  <circle cx="42" cy="42" r="34" fill="none" stroke="var(--mf-night-elevated)" stroke-width="9"></circle>
                  <circle cx="42" cy="42" r="34" fill="none" stroke="var(--mf-pink)" stroke-width="9" stroke-linecap="round" stroke-dasharray="{{ dashRingMealPlan }}" transform="rotate(-90 42 42)"></circle>
                </svg>
                <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
                  <span class="font-display" style="font-size:27px;font-weight:700;letter-spacing:-.02em;color:var(--mf-pink-deep);line-height:1">{{ dashCuisinees }}</span>
                </div>
              </div>
              <div style="min-width:0;flex:1;display:flex;flex-direction:column;gap:5px">
                <span class="mf-eyebrow" style="color:var(--mf-text-mute)">En cuisine — {{ dashMonth }}</span>
                <div class="font-display" style="font-size:16px;font-weight:700;color:var(--mf-text)">Recettes cuisinées</div>
                <div style="font-size:12.5px;color:var(--mf-text-soft);font-weight:500">{{ dashMealPlan }} % du meal plan réalisé</div>
                <sc-if value="{{ dashShowTrends }}" hint-placeholder-val="{{ true }}">
                  <span class="mf-badge {{ dashCuisineTrendClass }}" style="align-self:flex-start;white-space:normal">{{ dashCuisineTrendLabel }}</span>
                </sc-if>
              </div>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--mf-text-mute)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="m9 18 6-6-6-6"/></svg>
            </button>
            </sc-if>

            <sc-if value="{{ isNew }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;gap:12px;align-items:center;padding:13px 15px;background:var(--mf-yellow-soft);border-radius:var(--mf-radius-lg)">
                <image-slot id="mascot-dash" style="width:68px;height:68px;flex-shrink:0" shape="circle" placeholder="Chef"></image-slot>
                <p style="margin:0;font-size:12.5px;line-height:1.45;color:var(--mf-text);font-weight:500">Reviens dans quelques semaines pour voir tes tendances évoluer !</p>
              </div>
            </sc-if>

            <div style="display:flex;align-items:baseline;justify-content:space-between;padding:8px 2px 0">
              <span class="mf-eyebrow" style="color:var(--mf-text-mute)">Activité récente</span>
            </div>
            <section style="background:var(--mf-night-surface);border:1px solid var(--mf-night-line);border-radius:var(--mf-radius-xl);padding:4px 16px 8px">
              <div class="divide-y divide-border">
                <sc-for list="{{ entries }}" as="entry" hint-placeholder-count="3">
                  <x-import component-from-global-scope="MyFridge.ActivityEntry" entry="{{ entry }}" current-user-id="u1" hint-size="100%,54px"></x-import>
                </sc-for>
              </div>
            </section>
          </div>
          </sc-if>
          <sc-if value="{{ isDetail }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;align-items:center;gap:12px;padding:8px 16px 10px;flex-shrink:0">
            <button onClick="{{ goBack }}" style="width:36px;height:36px;border-radius:999px;border:1px solid var(--mf-night-line);background:var(--mf-night-surface);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--mf-text)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
            <div style="min-width:0">
              <div class="font-display" style="font-size:19px;font-weight:700;letter-spacing:-.015em;color:var(--mf-text);line-height:1.15">Statistiques</div>
              <div style="font-size:12px;color:var(--mf-text-mute);font-weight:500">{{ periodRange }}</div>
            </div>
          </div>
          <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 34px;text-align:center">
              <image-slot id="mascot-empty-m" style="width:132px;height:132px" shape="circle" placeholder="Chef · idontknow"></image-slot>
              <div class="font-display" style="font-size:20px;font-weight:700;letter-spacing:-.015em;color:var(--mf-text)">Rien à se mettre sous la dent</div>
              <p style="margin:0;font-size:14px;line-height:1.5;color:var(--mf-text-soft);text-wrap:pretty">Ajoute tes premiers articles pour commencer à suivre ton impact !</p>
              <button class="mf-btn mf-btn-primary" style="margin-top:2px">Ajouter un article</button>
            </div>
          </sc-if>
          <sc-if value="{{ hasData }}" hint-placeholder-val="{{ true }}">
          <div style="padding:0 16px 10px;flex-shrink:0;display:flex;flex-direction:column;gap:9px">
            <div style="display:flex;gap:7px;overflow-x:auto;padding-bottom:2px">
              <sc-for list="{{ periodOpts }}" as="o" hint-placeholder-count="4">
                <button class="{{ o.cls }}" onClick="{{ o.on }}" style="flex-shrink:0;font-size:12px;padding:7px 12px;border-radius:999px">{{ o.label }}</button>
              </sc-for>
            </div>
            <div class="mf-toggle-group" style="width:100%">
              <sc-for list="{{ blockOpts }}" as="o" hint-placeholder-count="3">
                <button class="{{ o.cls }}" onClick="{{ o.on }}" style="flex:1;font-size:12.5px;padding:8px 6px">{{ o.label }}</button>
              </sc-for>
            </div>
          </div>
          <div class="mfscroll" style="flex:1;overflow-y:auto;padding:4px 16px 18px;display:flex;flex-direction:column;gap:12px">

            <sc-if value="{{ isNew }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;gap:12px;align-items:center;padding:13px 15px;background:var(--mf-yellow-soft);border-radius:var(--mf-radius-lg)">
                <image-slot id="mascot-recent-m" style="width:68px;height:68px;flex-shrink:0" shape="circle" placeholder="Chef"></image-slot>
                <p style="margin:0;font-size:12.5px;line-height:1.45;color:var(--mf-text);font-weight:500">Ton foyer a 9 jours. Reviens dans quelques semaines pour voir tes tendances évoluer !</p>
              </div>
            </sc-if>

            <sc-if value="{{ anchorGaspi }}" hint-placeholder-val="{{ true }}">
              <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px">
                <div style="grid-column:span 2;background:var(--mf-night-surface);border:1px solid var(--mf-night-line);border-radius:var(--mf-radius-xl);padding:15px 16px;display:flex;flex-direction:column;gap:6px">
                  <span class="mf-eyebrow" style="color:var(--mf-text-mute)">Taux d'utilisation</span>
                  <div style="display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 10px;min-width:0">
                    <span class="font-display" style="font-size:42px;line-height:.9;font-weight:700;letter-spacing:-.03em;color:var(--mf-green-deep)">{{ taux }}<span style="font-size:20px">%</span></span>
                    <sc-if value="{{ showTrends }}" hint-placeholder-val="{{ true }}">
                      <span class="mf-badge {{ tauxTrendClass }}" style="white-space:nowrap">{{ tauxTrendLabel }}</span>
                    </sc-if>
                  </div>
                  <div style="font-size:12.5px;color:var(--mf-text-soft);font-weight:500">Articles consommés rapportés au total sorti du stock</div>
                </div>
                <div style="background:var(--mf-night-surface);border:1px solid var(--mf-night-line);border-radius:var(--mf-radius-lg);padding:13px 14px;display:flex;flex-direction:column;gap:3px">
                  <span class="mf-eyebrow" style="color:var(--mf-text-mute)">Consommés</span>
                  <span class="font-display" style="font-size:27px;font-weight:700;color:var(--mf-text);line-height:1.05">{{ consommes }}</span>
                </div>
                <div style="background:var(--mf-night-surface);border:1px solid var(--mf-night-line);border-radius:var(--mf-radius-lg);padding:13px 14px;display:flex;flex-direction:column;gap:3px">
                  <span class="mf-eyebrow" style="color:var(--mf-text-mute)">Jetés</span>
                  <span class="font-display" style="font-size:27px;font-weight:700;color:var(--mf-danger);line-height:1.05">{{ jetes }}</span>
                </div>
                <div style="grid-column:span 2;background:var(--mf-green-soft);border-radius:var(--mf-radius-lg);padding:13px 15px;display:flex;align-items:center;gap:12px">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--mf-green-deep)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
                  <div>

    return {
      points: s,
      area: "M" + pad + "," + (h - pad) + " L" + pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L") + " L" + (w - pad) + "," + (h - pad) + " Z",
      lx: pts[n - 1][0].toFixed(1), ly: pts[n - 1][1].toFixed(1),
      dots: pts.map((p, i) => ({ x: p[0].toFixed(1), y: p[1].toFixed(1), v: vals[i] }))
    };
  }

  donut(vals, colors, r) {
    const C = 2 * Math.PI * r, total = vals.reduce((a, b) => a + b, 0) || 1;
    let acc = 0;
    return vals.map((v, i) => {
      const len = (v / total) * C, gap = total > 0 && vals.length > 1 ? 3 : 0;
      const draw = Math.max(len - gap, 0.5);
      const seg = { dash: draw.toFixed(2) + " " + (C - draw).toFixed(2), offset: (-acc).toFixed(2), color: colors[i], pct: Math.round((v / total) * 100), circ: C.toFixed(2) };
      acc += len;
      return seg;
    });
  }

  entries() {
    const now = Date.now(), iso = m => new Date(now - m * 60000).toISOString();
    const c = { id: "u1", name: "Camille Dubois", isFormerMember: false };
    const l = { id: "u3", name: "Léa Martin", isFormerMember: false };
    const t = { id: "u4", name: "Thomas Bernard", isFormerMember: false };
    return [
      { id: "a1", action: "recipe_cooked", targetType: "recipe", targetId: "r1", itemNameSnapshot: null, metadata: { recipeName: "Gratin de courgettes", deductedIngredientCount: 5 }, actor: c, createdAt: iso(24) },
      { id: "a2", action: "item_consumed", targetType: "stored_item", targetId: "s3", itemNameSnapshot: "Lait demi-écrémé", metadata: { quantity: 1, unit: "l" }, actor: l, createdAt: iso(96) },
      { id: "a3", action: "item_thrown", targetType: "stored_item", targetId: "s2", itemNameSnapshot: "Salade verte", metadata: { quantity: 1, unit: "piece" }, actor: t, createdAt: iso(180) }
    ];
  }

  opts(list, current, setter) {
    return list.map(o => ({ ...o, cls: "mf-toggle-opt" + (o.key === current ? " is-active" : ""), on: () => setter(o.key) }));
  }

  componentDidUpdate() {
    if (this.state.screen !== "detail") { this._lastAnchor = null; return; }
    const el = this._blocks && this._blocks[this.state.anchor];
    if (el && this._scroller && this._lastAnchor !== this.state.anchor) {
      this._scroller.scrollTop = Math.max(0, el.offsetTop - 10);
    }
    this._lastAnchor = this.state.anchor;
  }

  renderVals() {
    const p = this.props || {};
    if (!this._blocks) this._blocks = {};
    const st = this.state;
    const household = st.household;
    const isEmpty = household === "vide";
    const isNew = household === "recent";
    const isSolo = household === "solo";
    const periodKey = isNew || isEmpty ? "mois" : st.period;
    const d = isNew ? this.NEWDATA() : this.DATA()[periodKey];
    const per = this.PERIODS().find(x => x.key === periodKey);
    const showTrends = !isNew && !isEmpty && d.tauxDelta !== null;

    const members = isSolo ? this.MEMBERS().slice(0, 1) : this.MEMBERS();
    const cut = arr => (isSolo ? [arr.reduce((a, b) => a + b, 0)] : arr);
    const ajouts = cut(d.ajouts), cuissons = cut(d.cuissons), courses = cut(d.courses);
    const sum = a => a.reduce((x, y) => x + y, 0);
    const colors = members.map(m => m.color);
    const mk = (vals) => {
      const segs = this.donut(vals, colors, 46);
      return members.map((m, i) => ({ ...m, value: vals[i], pct: segs[i].pct, dash: segs[i].dash, offset: segs[i].offset }));
    };
    const addSegs = mk(ajouts), cookSegs = mk(cuissons), shopSegs = mk(courses);
    const topShare = Math.max(...ajouts) / (sum(ajouts) || 1);

    const trendVals = [71, 74, 73, 76, 78, 82, 86];
    const cookVals = [13, 15, 14, 18, 16, 19, 23];
    const trendMonths = ["Jan", "Fév", "Mar", "Avr", "Mai", "Juin", "Juil"];
    const big = this.line(trendVals, 620, 160, 66, 92);
    const small = this.line(trendVals, 300, 112, 66, 92);

    const wasteMax = Math.max(...d.waste.map(w => w[1]));
    const keepMax = Math.max(...d.keep.map(k => k[1]));
    const catMax = Math.max(...d.topCats.map(c => c[1]));

    const tDelta = d.tauxDelta, cDelta = d.cuisineesDelta;
    const pos = v => v > 0;

    const dd = isNew ? this.NEWDATA() : this.DATA().mois;
    const dashTrends = !isNew && !isEmpty && dd.tauxDelta !== null;
    const pill = (v, unit, ref) => v === null ? { l: "", cls: "" }
      : { l: (v > 0 ? "↑ +" : "↓ ") + v + unit + " vs " + ref, cls: v > 0 ? "mf-badge-green" : "mf-badge-danger" };
    const dTaux = pill(dd.tauxDelta, " pts", dd.ref), dCuis = pill(dd.cuisineesDelta, "", dd.ref);

    return {
      themeClass: (p.theme || "Clair") === "Sombre" ? "dark" : "",
      showMobile: (p.layout || "Mobile + Ordinateur") !== "Ordinateur",
      showDesktop: (p.layout || "Mobile + Ordinateur") !== "Mobile",
      householdName: isSolo ? "Chez Camille" : "Foyer Dubois",
      isDashboard: st.screen === "dashboard",
      isDetail: st.screen === "detail",
      dashNavBg: st.screen === "dashboard" ? "var(--mf-green-soft)" : "transparent",
      dashNavFg: st.screen === "dashboard" ? "var(--mf-green-deep)" : "var(--mf-text-soft)",
      statsNavBg: st.screen === "detail" ? "var(--mf-green-soft)" : "transparent",
      statsNavFg: st.screen === "detail" ? "var(--mf-green-deep)" : "var(--mf-text-soft)",
      isVariantA: st.variant === "A",
      isVariantB: st.variant === "B",
      isEmpty, isNew, isSolo,
      hasData: !isEmpty,
      showFoyerShared: !isSolo,
      dashMonth: dd.month, dashTaux: dd.taux, dashConsommes: dd.consommes, dashJetes: dd.jetes,
      dashCuisinees: dd.cuisinees, dashDifferentes: dd.differentes, dashMealPlan: dd.mealPlan,
      dashShowTrends: dashTrends,
      dashTauxTrendLabel: dTaux.l, dashTauxTrendClass: dTaux.cls,
      dashCuisineTrendLabel: dCuis.l, dashCuisineTrendClass: dCuis.cls,
      dashRingTaux: ((dd.taux / 100) * 2 * Math.PI * 34).toFixed(1) + " " + (2 * Math.PI * 34).toFixed(1),
      dashRingMealPlan: ((dd.mealPlan / 100) * 2 * Math.PI * 34).toFixed(1) + " " + (2 * Math.PI * 34).toFixed(1),
      screenOpts: this.opts([{ key: "dashboard", label: "Tableau de bord" }, { key: "detail", label: "Page détail" }], st.screen, k => this.setState({ screen: k })),
      variantOpts: this.opts([{ key: "A", label: "A · Chiffre dominant" }, { key: "B", label: "B · Jauge" }], st.variant, k => this.setState({ variant: k })),
      householdOpts: this.opts([{ key: "nominal", label: "Nominal" }, { key: "recent", label: "Foyer récent" }, { key: "vide", label: "Foyer vide" }, { key: "solo", label: "Solo" }], household, k => this.setState({ household: k })),
      periodOpts: this.opts(this.PERIODS().map(x => ({ key: x.key, label: x.label })), periodKey, k => this.setState({ period: k })),
      periodRange: per.range,
      periodLabel: per.label,
      monthLabel: d.month,
      taux: d.taux, consommes: d.consommes, jetes: d.jetes, sauves: d.sauves,
      cuisinees: d.cuisinees, differentes: d.differentes, mealPlan: d.mealPlan, batch: d.batch,
      showTrends,
      tauxTrendLabel: tDelta === null ? "" : (pos(tDelta) ? "↑ +" : "↓ ") + tDelta + " pts vs " + d.ref,
      tauxTrendClass: tDelta === null ? "" : pos(tDelta) ? "mf-badge-green" : "mf-badge-danger",
      cuisineTrendLabel: cDelta === null ? "" : (pos(cDelta) ? "↑ +" : "↓ ") + cDelta + " vs " + d.ref,
      cuisineTrendClass: cDelta === null ? "" : pos(cDelta) ? "mf-badge-green" : "mf-badge-danger",
      sparkTaux: this.line(trendVals.slice(-6), 120, 40, 66, 92),
      sparkCuisine: this.line(cookVals.slice(-6), 120, 40, 10, 26),
      ringTaux: ((d.taux / 100) * 2 * Math.PI * 34).toFixed(1) + " " + (2 * Math.PI * 34).toFixed(1),
      ringMealPlan: ((d.mealPlan / 100) * 2 * Math.PI * 34).toFixed(1) + " " + (2 * Math.PI * 34).toFixed(1),
      trendLine: big.points, trendArea: big.area,
      trendDots: big.dots.map((pt, i) => ({ ...pt, m: trendMonths[i], lx: (pt.x - 14).toFixed(1), ly: (pt.y - 14).toFixed(1) })),
      trendLineSm: small.points, trendAreaSm: small.area,
      trendDotsSm: small.dots.map((pt, i) => ({ ...pt, m: trendMonths[i] })),
      anchorFoyer: st.anchor === "foyer",
      blockOpts: this.opts([{ key: "gaspi", label: "Anti-gaspi" }, { key: "cuisine", label: "Cuisine" }, { key: "foyer", label: "Foyer" }], st.anchor, k => this.setState({ anchor: k })),
      favRecipe: "Gratin de courgettes",
      favCount: 6,
      soloIntro: "Tu as ajouté " + ajouts[0] + " articles, cuisiné " + cuissons[0] + " fois et coché " + courses[0] + " articles de courses.",
      foyerIntro: "Le foyer a ajouté " + sum(ajouts) + " articles" + (periodKey === "mois" ? " ce mois" : "") + ", avec la participation de tous les membres.",
      wasteBars: d.waste.map(w => ({ name: w[0], count: w[1], color: w[2], pct: Math.round((w[1] / wasteMax) * 100) })),
      topWaste: d.waste[0][0].toLowerCase(),
      topWasteCount: d.waste[0][1],
      keepBars: d.keep.map(k => ({ name: k[0], days: k[1], pct: Math.round((k[1] / keepMax) * 100) })),
      catBars: d.topCats.map((c, i) => ({ name: c[0], count: c[1], pct: Math.round((c[1] / catMax) * 100), rank: i + 1 })),
      totalAjouts: sum(ajouts), totalCuissons: sum(cuissons), totalCourses: sum(courses),
      addSegs, cookSegs, shopSegs, members,
      memberCount: members.length,
      soloAdds: ajouts[0], soloCooks: cuissons[0], soloShops: courses[0],
      showTeamNudge: !isSolo && !isEmpty && topShare > 0.55,
      addListText: members.map((m, i) => m.name + " " + ajouts[i]).join(" · "),
      entries: this.entries(),
      refScroll: el => { this._scroller = el; },
      refGaspi: el => { this._blocks.gaspi = el; },
      refCuisine: el => { this._blocks.cuisine = el; },
      refFoyer: el => { this._blocks.foyer = el; },
      goStats: () => this.setState({ screen: "detail", anchor: "gaspi" }),
      goGaspi: () => this.setState({ screen: "detail", anchor: "gaspi" }),
      goCuisine: () => this.setState({ screen: "detail", anchor: "cuisine" }),
      goBack: () => this.setState({ screen: "dashboard" }),
      anchorGaspi: st.anchor === "gaspi",
      anchorCuisine: st.anchor === "cuisine"
    };
  }
}
</script>
</body>
</html>
