<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fresh — Journal des sorties (Mobile)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf8ed; --card: #ffffff; --sub: #f6efde;
    --ink: #1a1d1a; --ink-2: #5e6760; --ink-3: #9ba59f; --rule: #ece4d2;
    --green: #2bb673; --green-soft: #d6f3e3; --green-deep: #1f9c5e;
    --orange: #ff7a3a; --orange-soft: #ffe0cc;
    --red: #ef4a5a; --red-soft: #ffd9de;
    --yellow: #ffc839; --yellow-soft: #fff1c4;
    --blue: #4f8ef5; --blue-soft: #dae9ff;
    --pink: #ff6f9c; --pink-soft: #ffd9e6;
    --purple: #8c6df0; --purple-soft: #e4dafa;
    --font-display: "DM Sans", system-ui, sans-serif;
    --font-body: "Inter", ui-sans-serif, system-ui, sans-serif;
    --bezel: #1a1d1a; --bezel-2: #3a3d3a; --island: #1a1d1a;
  }
  [data-theme="dark"] {
    --bg: #15181b; --card: #1f2326; --sub: #272c30;
    --ink: #f4ede0; --ink-2: #a8b0a8; --ink-3: #6a7370; --rule: #2e3439;
    --green: #34c97f; --green-soft: #1d3a2c; --green-deep: #5ee4a0;
    --orange: #ff8a4f; --orange-soft: #4a2a1a;
    --red: #ff6071; --red-soft: #4a1d24;
    --yellow: #ffd158; --yellow-soft: #423318;
    --blue: #6aa3ff; --blue-soft: #1c2e4d;
    --pink: #ff8fb0; --pink-soft: #4a2130;
    --purple: #a48cff; --purple-soft: #2e2350;
    --bezel: #000; --bezel-2: #2a2d2a; --island: #000;
  }
  [data-theme="dark"] .badge-soft-yellow { color: #ffd97a; }
  [data-theme="dark"] .badge-soft-blue { color: #9cc2ff; }
  [data-theme="dark"] .badge-soft-purple { color: #c3acff; }
  [data-theme="dark"] .badge-soft-orange { color: #ffb88a; }
  [data-theme="dark"] .badge-soft-pink { color: #ff9fbd; }
  [data-theme="dark"] .badge-soft-red { color: #ff9aa6; }

  .theme-toggle {
    position: fixed; top: 22px; right: 24px; z-index: 200;
    background: #fff; color: #1a1d1a; border: 1px solid rgba(0,0,0,.08); border-radius: 999px;
    padding: 9px 15px 9px 13px; display: inline-flex; align-items: center; gap: 9px;
    font-family: var(--font-display); font-weight: 700; font-size: 13px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  [data-theme="dark"] .theme-toggle { background: #1f2326; color: #f4ede0; border-color: #2e3439; }
  .theme-toggle .tsw { width: 30px; height: 17px; border-radius: 999px; background: #d8d0bf; position: relative; transition: background .2s; }
  .theme-toggle .tsw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: left .2s; }
  [data-theme="dark"] .theme-toggle .tsw { background: var(--green); }
  [data-theme="dark"] .theme-toggle .tsw::after { left: 15px; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #e8e0cf; color: var(--ink); font-family: var(--font-body);
    -webkit-font-smoothing: antialiased; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 36px 20px;
  }

  .phone {
    width: 390px; background: var(--bg); border-radius: 52px; padding: 8px;
    box-shadow: 0 0 0 11px var(--bezel), 0 0 0 12px var(--bezel-2),
      0 30px 60px -20px rgba(0,0,0,.32), 0 18px 36px -22px rgba(0,0,0,.22);
    position: relative; flex-shrink: 0;
  }
  .scr { background: var(--bg); border-radius: 44px; overflow: hidden; position: relative; height: 844px; display: flex; flex-direction: column; }

  .statusbar { height: 50px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--ink); position: relative; z-index: 5; }
  .statusbar .time { font-variant-numeric: tabular-nums; }
  .statusbar .ind { display: flex; gap: 6px; align-items: center; }
  .statusbar::after { content: ""; position: absolute; top: 9px; left: 50%; transform: translateX(-50%); width: 92px; height: 30px; border-radius: 999px; background: var(--island); }

  .nav { display: flex; align-items: center; gap: 14px; padding: 4px 20px 12px; flex-shrink: 0; background: var(--bg); }
  .nav .back { width: 36px; height: 36px; border-radius: 12px; background: var(--card); display: flex; align-items: center; justify-content: center; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.04); flex-shrink: 0; }
  .nav .title-wrap { flex: 1; min-width: 0; }
  .nav .title { font-family: var(--font-display); font-weight: 700; font-size: 19px; color: var(--ink); line-height: 1.1; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
  .nav .sub { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
  .nav .navbtn { width: 38px; height: 38px; border-radius: 12px; border: 0; background: var(--card); color: var(--ink-2); cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(0,0,0,.04); flex-shrink: 0; }

  .body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 18px 20px; scrollbar-width: none; }
  .body::-webkit-scrollbar { display: none; }

  .lic { width: 1em; height: 1em; vertical-align: -0.13em; }

  /* ── Anti-gaspi hero ─────────────────────────────────────── */
  #hero { margin-bottom: 16px; }
  .ag-card { background: linear-gradient(150deg, #e4f6ec 0%, var(--card) 74%); border: 1px solid #b9e6cd; border-radius: 20px; padding: 16px 16px 14px; box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 8px 20px rgba(43,182,115,.08); }
  [data-theme="dark"] .ag-card { background: linear-gradient(150deg, #16352a 0%, var(--card) 74%); border-color: #24513c; }
  .ag-head { display: flex; align-items: center; justify-content: space-between; }
  .ag-lbl { font-family: var(--font-display); font-size: 12px; font-weight: 700; color: var(--green-deep); }
  .ag-leaf { width: 34px; height: 34px; border-radius: 11px; background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(43,182,115,.3); }
  .ag-rate { font-family: var(--font-display); font-size: 40px; font-weight: 800; letter-spacing: -0.02em; color: var(--green-deep); line-height: 1; margin-top: 6px; }
  .ag-rate span { font-size: 22px; }
  .ag-bar { height: 9px; border-radius: 999px; background: var(--red); overflow: hidden; margin: 12px 0 9px; }
  .ag-bar span { display: block; height: 100%; background: var(--green); border-radius: 999px 0 0 999px; }
  .ag-legend { display: flex; gap: 16px; font-family: var(--font-display); font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
  .ag-legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .ag-legend .dot.g { background: var(--green); }
  .ag-legend .dot.r { background: var(--red); }

  .mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .ms { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 11px 10px; display: flex; align-items: center; gap: 8px; }
  .ms > .lic { width: 20px; height: 20px; flex-shrink: 0; }
  .ms.consumed > .lic { color: var(--green-deep); }
  .ms.wasted > .lic { color: var(--red); }
  .ms.removed > .lic { color: var(--ink-3); }
  .ms b { font-family: var(--font-display); font-size: 17px; font-weight: 800; display: block; line-height: 1; }
  .ms span { font-size: 10px; color: var(--ink-2); font-family: var(--font-display); font-weight: 600; }

  /* ── Filter chips ────────────────────────────────────────── */
  #chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 14px; scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  .chip-f { appearance: none; border: 0; cursor: pointer; flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px; background: var(--card); border: 1px solid var(--rule); border-radius: 999px; font-family: var(--font-display); font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
  .chip-f .ct { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; background: var(--sub); color: var(--ink-2); }
  .chip-f.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip-f.active .ct { background: rgba(255,255,255,.2); color: var(--bg); }
  .chip-f.consumed.active { background: var(--green); border-color: var(--green); }
  .chip-f.wasted.active { background: var(--red); border-color: var(--red); }
  .chip-f.removed.active { background: var(--ink-2); border-color: var(--ink-2); }
  [data-theme="dark"] .chip-f.active, [data-theme="dark"] .chip-f.consumed.active, [data-theme="dark"] .chip-f.wasted.active { color: #0e1113; }

  /* ── Day header ──────────────────────────────────────────── */
  .jm-day { display: flex; align-items: baseline; gap: 8px; margin: 14px 2px 9px; }
  .jm-day .dl { font-family: var(--font-display); font-size: 14px; font-weight: 800; letter-spacing: -0.01em; }
  .jm-day .dd { font-family: var(--font-display); font-size: 11.5px; font-weight: 600; color: var(--ink-3); }
  .jm-day .dc { margin-left: auto; font-family: var(--font-display); font-size: 11px; font-weight: 600; color: var(--ink-3); }

  /* ── Entry card ──────────────────────────────────────────── */
  .jm-entry { position: relative; display: flex; gap: 11px; align-items: flex-start; background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 12px 13px 12px 15px; margin-bottom: 9px; box-shadow: 0 1px 2px rgba(0,0,0,.03); overflow: hidden; }
  .jm-entry::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 999px; }
  .jm-entry.consumed::before { background: var(--green); }
  .jm-entry.wasted::before { background: var(--red); }
  .jm-entry.removed::before { background: var(--ink-3); }
  .jm-thumb { width: 46px; height: 46px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .jm-mid { flex: 1; min-width: 0; }
  .jm-name { font-family: var(--font-display); font-weight: 700; font-size: 14.5px; line-height: 1.15; color: var(--ink); }
  .jm-sub { display: flex; align-items: center; gap: 8px; margin-top: 7px; flex-wrap: wrap; }
  .act-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; font-family: var(--font-display); font-size: 11px; font-weight: 700; }
  .act-badge.consumed { background: var(--green-soft); color: var(--green-deep); }
  .act-badge.wasted { background: var(--red-soft); color: #b0323f; }
  .act-badge.removed { background: var(--sub); color: var(--ink-2); }
  [data-theme="dark"] .act-badge.wasted { color: #ff9aa6; }
  .jm-qty { font-family: var(--font-display); font-size: 12px; font-weight: 700; color: var(--ink-2); }
  .jm-foot { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 11px; color: var(--ink-3); font-family: var(--font-display); font-weight: 600; }
  .jm-foot .ava { width: 19px; height: 19px; border-radius: 50%; font-size: 8.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .jm-note { font-style: italic; color: var(--ink-2); font-family: var(--font-body); font-weight: 500; }
  .jm-time { font-family: var(--font-display); font-size: 12px; font-weight: 700; color: var(--ink-3); flex-shrink: 0; padding-top: 1px; }

  .jm-empty { text-align: center; color: var(--ink-3); padding: 50px 0; font-family: var(--font-display); font-weight: 600; font-size: 13px; }
  .jm-empty .lic { font-size: 28px; display: block; margin: 0 auto 10px; opacity: .6; }

  /* ── Tab bar ─────────────────────────────────────────────── */
  .tabbar { background: var(--card); border-top: 1px solid var(--rule); padding: 10px 8px 28px; flex-shrink: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .tabbar .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 6px; color: var(--ink-3); border-radius: 14px; }
  .tabbar .tab.active { background: var(--green-soft); color: var(--green-deep); }
  .tabbar .tab .lbl { font-family: var(--font-display); font-size: 10.5px; font-weight: 600; }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle"><i data-lucide="moon" class="lic"></i> <span id="themeLbl">Sombre</span> <span class="tsw"></span></button>

<div class="phone">
  <div class="scr" id="scr">
    <div class="statusbar">
      <span class="time">9:41</span>
      <span class="ind">
        <svg width="18" height="11" viewBox="0 0 18 11" fill="currentColor"><path d="M0 8h2v3H0zM4 6h2v5H4zM8 4h2v7H8zM12 2h2v9h-2zM16 0h2v11h-2z"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1"><path d="M8 3a8 8 0 0 1 5.5 2.2M8 6a5 5 0 0 1 3.5 1.4M8 9.5a1 1 0 0 1 .8.4"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="1" y="1" width="20" height="10" rx="2.5" stroke="currentColor" stroke-width="1"/><rect x="2.5" y="2.5" width="17" height="7" rx="1.5" fill="currentColor"/><rect x="22" y="4" width="2" height="4" rx="0.7" fill="currentColor"/></svg>
      </span>
    </div>

    <div class="nav">
      <div class="back"><i data-lucide="chevron-left" class="lic"></i></div>
      <div class="title-wrap">
        <div class="title"><i data-lucide="history" class="lic" style="color:#1f9c5e"></i> Journal des sorties</div>
        <div class="sub" id="navSub">14 sorties · ce mois-ci</div>
      </div>
      <button class="navbtn"><i data-lucide="sliders-horizontal" class="lic"></i></button>
    </div>

    <div class="body">
      <div id="hero"></div>
      <div id="chips"></div>
      <div id="log"></div>
    </div>

    <div class="tabbar">
      <div class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12 12 3l9 9v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span class="lbl">Accueil</span></div>
      <div class="tab active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="3"/><circle cx="17" cy="11" r="3"/><circle cx="9" cy="16" r="3"/></svg><span class="lbl">Stock</span></div>
      <div class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2 11h12l2-7H7"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg><span class="lbl">Courses</span></div>
      <div class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5a2 2 0 0 1 2-2h6v18H5a2 2 0 0 1-2-2zM21 5a2 2 0 0 0-2-2h-6v18h6a2 2 0 0 0 2-2z"/></svg><span class="lbl">Recettes</span></div>
      <div class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span class="lbl">Plus</span></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="journal-sorties-mobile.js"></script>
</body>
</html>
