<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fridgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#fridgeGrad)"/>
  <!-- Fridge body -->
  <rect x="156" y="96" width="200" height="320" rx="16" fill="#ffffff"/>
  <!-- Fridge divider line -->
  <line x1="156" y1="220" x2="356" y2="220" stroke="#E5E7EB" stroke-width="4"/>
  <!-- Top door handle -->
  <rect x="320" y="140" width="16" height="50" rx="8" fill="#9CA3AF"/>
  <!-- Bottom door handle -->
  <rect x="320" y="260" width="16" height="80" rx="8" fill="#9CA3AF"/>
  <!-- Freezer items (simplified) -->
  <rect x="180" y="130" width="100" height="20" rx="4" fill="#DBEAFE"/>
  <rect x="180" y="160" width="80" height="20" rx="4" fill="#BFDBFE"/>
  <!-- Fridge items (simplified) -->
  <circle cx="200" cy="280" r="20" fill="#FCA5A5"/>
  <circle cx="250" cy="290" r="18" fill="#86EFAC"/>
  <rect x="290" y="260" width="15" height="40" rx="4" fill="#FDE68A"/>
  <rect x="180" y="340" width="60" height="30" rx="6" fill="#E0E7FF"/>
  <rect x="260" y="330" width="50" height="40" rx="6" fill="#FECACA"/>
</svg>

